<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>Admin Panel | Matale Web Developers</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080b14;
    color:white;
}


/* LOGIN */

#loginPage{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
    radial-gradient(circle at top right,#00d4ff20,transparent 40%);

}

.login-box{

    width:100%;
    max-width:420px;

    background:#111624;

    padding:35px;

    border-radius:15px;

    border:1px solid #202637;

}

.login-box h1{
    margin-bottom:10px;
}

.login-box p{
    color:#9da5b5;
    margin-bottom:25px;
}


input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    background:#080b14;

    color:white;

    border:1px solid #2a3244;

    border-radius:8px;

    outline:none;

}

input:focus{
    border-color:#00d4ff;
}


button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:8px;

    background:#00d4ff;

    color:#061018;

    font-weight:bold;

    cursor:pointer;

}

button:disabled{
    opacity:.6;
}


#error{
    color:#ff6b6b;
    margin-top:15px;
    text-align:center;
}


/* ADMIN */

#adminPage{
    display:none;
}


.topbar{

    height:70px;

    padding:0 25px;

    background:#111624;

    border-bottom:1px solid #202637;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#00d4ff;
}

.logout{

    width:auto;

    padding:9px 18px;

    background:#202637;

    color:white;

}


/* DASHBOARD */

.dashboard{

    max-width:1200px;

    margin:auto;

    padding:30px 20px;

}

.dashboard h1{
    margin-bottom:25px;
}


.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;

    margin-bottom:30px;

}

.stat{

    background:#111624;

    border:1px solid #202637;

    border-radius:12px;

    padding:25px;

}

.stat h2{
    color:#00d4ff;
    font-size:32px;
}


/* SEARCH */

.search{

    width:100%;

    padding:14px;

    margin-bottom:20px;

    background:#111624;

    border:1px solid #202637;

    color:white;

    border-radius:8px;

}


/* INQUIRIES */

.inquiry{

    background:#111624;

    border:1px solid #202637;

    border-radius:12px;

    padding:22px;

    margin-bottom:15px;

}

.inquiry-header{

    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-bottom:15px;

}

.inquiry h3{
    margin-bottom:5px;
}

.inquiry small{
    color:#00d4ff;
}

.inquiry p{
    color:#b1b8c6;
    margin-top:8px;
    word-break:break-word;
}

.delete{

    width:auto;

    padding:8px 13px;

    background:#ff4d5a;

    color:white;

}

.empty{

    text-align:center;

    color:#8e96a6;

    padding:50px;

}


/* MOBILE */

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr;
    }

    .inquiry-header{
        flex-direction:column;
    }

    .delete{
        width:100%;
    }

}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="loginPage">

<div class="login-box">

<h1>Admin Login 🔐</h1>

<p>
Matale Web Developers
</p>


<form id="loginForm">

<input
type="email"
id="email"
placeholder="Admin Email"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button type="submit">
Login
</button>

</form>


<div id="error"></div>

</div>

</div>



<!-- ADMIN -->

<div id="adminPage">


<div class="topbar">

<div class="logo">

Matale <span>Admin Panel</span>

</div>

<button
class="logout"
id="logoutBtn"
>
Logout
</button>

</div>


<div class="dashboard">


<h1>Dashboard 📊</h1>


<div class="stats">

<div class="stat">

<p>Total Inquiries</p>

<h2 id="total">
0
</h2>

</div>


<div class="stat">

<p>Latest Inquiry</p>

<h2 id="latest">
-
</h2>

</div>


<div class="stat">

<p>Status</p>

<h2>
Active
</h2>

</div>

</div>


<input
class="search"
id="search"
placeholder="🔎 Search inquiries..."
>


<div id="inquiries">

<div class="empty">
Loading inquiries...
</div>

</div>


</div>

</div>



<script type="module">

import {

    auth,

    db,

    signInWithEmailAndPassword,

    onAuthStateChanged,

    signOut,

    collection,

    getDocs,

    query,

    orderBy,

    deleteDoc,
    doc

} from "./firebase.js";


const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const loginForm =
document.getElementById("loginForm");

const errorBox =
document.getElementById("error");

const logoutBtn =
document.getElementById("logoutBtn");

const inquiriesBox =
document.getElementById("inquiries");

const totalBox =
document.getElementById("total");

const latestBox =
document.getElementById("latest");

const searchBox =
document.getElementById("search");


let inquiries = [];



/* AUTH */

onAuthStateChanged(auth,(user)=>{

    if(user){

        loginPage.style.display="none";

        adminPage.style.display="block";

        loadInquiries();

    }else{

        loginPage.style.display="flex";

        adminPage.style.display="none";

    }

});



/* LOGIN */

loginForm.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    errorBox.textContent="";

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        loginForm.reset();

    }catch(error){

        console.error(error);

        errorBox.textContent =
        "❌ Invalid email or password.";

    }

});



/* LOGOUT */

logoutBtn.addEventListener(
"click",
async function(){

    await signOut(auth);

});



/* LOAD INQUIRIES */

async function loadInquiries(){

    inquiriesBox.innerHTML =
    '<div class="empty">Loading...</div>';

    try{

        const q = query(
            collection(db,"inquiries"),
            orderBy("createdAt","desc")
        );

        const snapshot =
        await getDocs(q);


        inquiries = [];

        snapshot.forEach((item)=>{

            inquiries.push({

                id:item.id,

                ...item.data()

            });

        });


        totalBox.textContent =
        inquiries.length;


        if(inquiries.length > 0){

            latestBox.textContent =
            "New";

        }else{

            latestBox.textContent =
            "-";

        }


        displayInquiries(inquiries);


    }catch(error){

        console.error(error);

        inquiriesBox.innerHTML =
        `
        <div class="empty">
        ❌ Unable to load inquiries.
        <br><br>
        Check your Firestore Security Rules.
        </div>
        `;

    }

}



/* DISPLAY */

function displayInquiries(list){

    if(list.length === 0){

        inquiriesBox.innerHTML =
        `
        <div class="empty">
        No inquiries found.
        </div>
        `;

        return;

    }


    inquiriesBox.innerHTML = "";


    list.forEach((item)=>{

        const div =
        document.createElement("div");

        div.className="inquiry";


        const date =
        item.createdAt?.toDate
        ? item.createdAt.toDate().toLocaleString()
        : "Just now";


        div.innerHTML = `

        <div class="inquiry-header">

            <div>

                <h3>
                ${escapeHTML(item.name || "Unknown")}
                </h3>

                <small>
                ${escapeHTML(item.service || "General")}
                </small>

            </div>

            <button
            class="delete"
            data-id="${item.id}"
            >
            Delete
            </button>

        </div>


        <p>
        📧 ${escapeHTML(item.email || "-")}
        </p>

        <p>
        📱 ${escapeHTML(item.phone || "-")}
        </p>

        <p>
        🕒 ${escapeHTML(date)}
        </p>

        <p>
        💬 ${escapeHTML(item.message || "-")}
        </p>

        `;


        div.querySelector(".delete")
        .addEventListener(
            "click",
            ()=>deleteInquiry(item.id)
        );


        inquiriesBox.appendChild(div);

    });

}



/* DELETE */

async function deleteInquiry(id){

    const confirmed =
    confirm(
        "Delete this inquiry?"
    );

    if(!confirmed) return;


    try{

        await deleteDoc(
            doc(db,"inquiries",id)
        );

        await loadInquiries();

    }catch(error){

        console.error(error);

        alert(
            "Unable to delete inquiry."
        );

    }

}



/* SEARCH */

searchBox.addEventListener(
"input",
function(){

    const term =
    searchBox.value.toLowerCase();


    const filtered =
    inquiries.filter((item)=>{

        return (

            (item.name || "")
            .toLowerCase()
            .includes(term)

            ||

            (item.email || "")
            .toLowerCase()
            .includes(term)

            ||

            (item.phone || "")
            .toLowerCase()
            .includes(term)

            ||

            (item.service || "")
            .toLowerCase()
            .includes(term)

            ||

            (item.message || "")
            .toLowerCase()
            .includes(term)

        );

    });


    displayInquiries(filtered);

});



/* SECURITY */

function escapeHTML(value){

    return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
